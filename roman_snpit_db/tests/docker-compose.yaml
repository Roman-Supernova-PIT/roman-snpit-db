services:
  mailhog:
    image: mailhog/mailhog:latest
    ports:
        - "8025:8025"

  postgres:
    image: ${DOCKER_ARCHIVE:-ghcr.io/roman-supernova-pit}/snpit-db-postgres:${DOCKER_VERSION:-test20250819}
    build:
      context: ../../docker/postgres
      target: postgres
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postrgresql/data
      - type: bind
        source: secrets
        target: /secrets
        read_only: true
    healthcheck:
      test: netcat -w 1 localhost 5432 || exit 1
      interval: 5s
      timeout: 10s
      retries: 10

  createdb:
    depends_on:
      postgres:
        condition: service_healthy
    image: ${DOCKER_ARCHIVE:-ghcr.io/roman-supernova-pit}/snpit-db-webserver-test:${DOCKER_VERSION:-test20250819}
    build:
      context: ../..
      dockerfile: docker/webserver/Dockerfile
      target: test
    environment:
      - SNPIT_CONFIG=/roman-snpit-db/config-test.yaml
    entrypoint:
      - python
      - -c
      - "import roman_snpit_db.migrations.apply_migrations as a; a.apply_migrations()"
    user: ${USERID:-0}:${GROUPID:-0}
      
        
  webserver:
    depends_on:
      createdb:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    healthcheck:
      test: netcat -w 1 localhost 8080 || exit 1
      interval: 5s
      timeout: 10s
      retries: 5
    image: ${DOCKER_ARCHIVE:-ghcr.io/roman-supernova-pit}/snpit-db-webserver-test:${DOCKER_VERSION:-test20250819}
    build:
      context: ../..
      dockerfile: docker/webserver/Dockerfile
      target: test
    environment:
      - SNPIT_CONFIG=/roman-snpit-db/config-test.yaml
    ports:
      - "8080:8080"
    user: ${USERID:-0}:${GROUPID:-0}
      

  shell:
    depends_on:
      postgres:
        condition: service_healthy
    image: rknop/roman-snpit-env:cpu
    volumes:
      - type: bind
        source: secrets
        target: /secrets
        read_only: true
      - type: bind
        source: ../..
        target: /code
    working_dir: /code
    command: tail -f /etc/issue


volumes:
  postgres_data:
